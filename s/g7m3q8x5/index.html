<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF7F2">
<title>Where is Rohit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F2;
    --card: #FFFFFF;
    --edge: #E6DED2;
    --ink: #1C1917;
    --muted: #7A6E63;
    --brass: #9A6B12;
    --sage: #4F7A54;
    --strike: #C2410C;
    --shadow: 0 1px 2px rgba(28, 25, 23, .05);
    --radius: 14px;
  }
  
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 26px 20px 48px; }

  .eyebrow {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px;
  }
  .hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: clamp(30px, 8.5vw, 42px);
    line-height: 1.06; margin: 0 0 10px; letter-spacing: -0.01em;
  }
  .hero .sub { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.5; }
  .hero .sub strong { color: var(--ink); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
  .chip {
    font-size: 13px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--edge); background: var(--card); color: var(--ink);
    text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
    box-shadow: var(--shadow);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brass); }
  .chip.live .dot { background: var(--strike); }
  .chip.free .dot { background: var(--sage); }

  h2.section {
    font-family: "Fraunces", Georgia, serif; font-weight: 400;
    font-size: 15px; color: var(--muted);
    margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--edge);
  }

  /* The day: a simple vertical flow. Never overlaps, however dense the day. */
  .slot { display: grid; grid-template-columns: 62px 1fr; gap: 12px; }
  .slot .when {
    font-size: 12px; color: var(--muted); text-align: right;
    font-variant-numeric: tabular-nums; padding-top: 12px; line-height: 1.45;
  }
  .slot .when .to { display: block; opacity: .65; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .ev {
    background: var(--card); border: 1px solid var(--edge);
    border-left: 3px solid var(--brass); border-radius: 10px;
    padding: 10px 13px; box-shadow: var(--shadow);
  }
  .ev.personal { border-left-color: var(--sage); }
  .ev.live { border-left-color: var(--strike); }
  .ev .k { font-size: 15px; font-weight: 500; }
  .ev .p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .ev .nowtag {
    float: right; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--strike); padding-top: 3px;
  }
  .together {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 2px 0 2px 2px;
  }

  .gap {
    display: grid; grid-template-columns: 62px 1fr; gap: 12px;
    align-items: center; margin: 6px 0;
  }
  .gap .line {
    border-top: 1px dashed var(--edge); position: relative; height: 1px;
  }
  .gap .txt {
    position: absolute; top: -9px; left: 0; background: var(--paper);
    padding-right: 10px; font-size: 11.5px; color: var(--muted);
  }
  .gap.here .line { border-top-color: var(--strike); }
  .gap.here .txt { color: var(--strike); }

  .empty {
    border: 1px dashed var(--edge); border-radius: var(--radius);
    padding: 22px; color: var(--muted); font-size: 14px; text-align: center;
  }

  .week { display: grid; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--edge);
    border-radius: 10px; padding: 11px 13px; box-shadow: var(--shadow);
  }
  .row .d { font-size: 13px; font-weight: 500; }
  .row .t { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .n { font-size: 12px; color: var(--brass); white-space: nowrap; }
  .row.off .n { color: var(--sage); }

  footer { margin-top: 30px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  footer .stale { color: var(--strike); }

  @media (prefers-reduced-motion: no-preference) {
    .chip.live .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Rohit's day</p>
  <div class="hero">
    <h1 id="headline">Loading</h1>
    <p class="sub" id="subline"></p>
    <div class="chips" id="chips"></div>
  </div>

  <h2 class="section" id="todayHeading">Today</h2>
  <div id="today"></div>

  <h2 class="section">Rest of the week</h2>
  <div class="week" id="week"></div>

  <footer>
    <div id="freshness"></div>
    <div>This page updates itself through the day. Times are Rohit's local times.</div>
  </footer>
</div>

Label":"6pm","endLabel":"6:45pm","type":"class","headline":"in a class","title":"Individual class","place":"In person"},{"s":1792764000000,"e":1792766700000,"startLabel":"7:30pm","endLabel":"8:15pm","type":"class","headline":"in a class","title":"Individual class","place":"Online"},{"s":1792766700000,"e":1792769400000,"startLabel":"8:15pm","endLabel":"9pm","type":"personal","headline":"on the way home","title":"Heading home","place":"On the road"}],"groups":[{"s":1792719900000,"e":1792723800000,"startLabel":"7:15am","endLabel":"8:20am","items":[{"s":1792719900000,"e":1792723800000,"startLabel":"7:15am","endLabel":"8:20am","type":"personal","headline":"driving","title":"School run","place":"On the road"}]},{"s":1792741500000,"e":1792745400000,"startLabel":"1:15pm","endLabel":"2:20pm","items":[{"s":1792741500000,"e":1792745400000,"startLabel":"1:15pm","endLabel":"2:20pm","type":"personal","headline":"driving","title":"School run","place":"On the road"}]},{"s":1792750500000,"e":1792753200000,"startLabel":"3:45pm","endLabel":"4:30pm","items":[{"s":1792750500000,"e":1792753200000,"startLabel":"3:45pm","endLabel":"4:30pm","type":"class","headline":"in a class","title":"Individual class","place":"Online"}]},{"s":1792753200000,"e":1792755900000,"startLabel":"4:30pm","endLabel":"5:15pm","items":[{"s":1792753200000,"e":1792755900000,"startLabel":"4:30pm","endLabel":"5:15pm","type":"class","headline":"in a class","title":"Individual class","place":"Online"}]},{"s":1792755900000,"e":1792758600000,"startLabel":"5:15pm","endLabel":"6pm","items":[{"s":1792755900000,"e":1792758600000,"startLabel":"5:15pm","endLabel":"6pm","type":"class","headline":"in a class","title":"Zoom class","place":"Online"}]},{"s":1792758600000,"e":1792761300000,"startLabel":"6pm","endLabel":"6:45pm","items":[{"s":1792758600000,"e":1792761300000,"startLabel":"6pm","endLabel":"6:45pm","type":"class","headline":"in a class","title":"Individual class","place":"In person"}]},{"s":1792764000000,"e":1792766700000 const statusFor = function statusFor(items, nowMs) {
  if (!items || items.length === 0) {
    return { state: "off", currents: [], next: null, untilMs: null };
  }
  const currents = [];
  let next = null;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (nowMs >= it.s && nowMs < it.e) currents.push(it);
    else if (nowMs < it.s && (next === null || it.s < next.s)) next = it;
  }
  if (currents.length) {
    let untilMs = currents[0].e;
    for (let i = 1; i < currents.length; i++) {
      if (currents[i].e > untilMs) untilMs = currents[i].e;
    }
    return { state: "in", currents: currents, next: next, untilMs: untilMs };
  }
  if (next) {
    const state = nowMs < items[0].s ? "before" : "gap";
    return { state: state, currents: [], next: next, untilMs: next.s };
  }
  return { state: "done", currents: [], next: null, untilMs: null };
};
const gapLabel = function gapLabel(ms) {
  if (ms <= 0) return "now";
  if (ms < 60000) return "under a minute";
  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + (mins === 1 ? " minute" : " minutes");
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (m === 0) return h + (h === 1 ? " hour" : " hours");
  return h + "h " + m + "m";
};
const headlineFor = function headlineFor(name, currents) {
  if (currents.length === 1) return name + " is " + currents[0].headline;
  const classes = currents.filter(function (c) { return c.type === "class"; });
  if (classes.length === currents.length) {
    return name + " is in " + currents.length + " classes at once";
  }
  return name + " is " + currents[0].headline;
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function todayIndex(nowMs) {
  for (var i = 0; i < MODEL.days.length; i++) {
    if (nowMs >= MODEL.days[i].dayStartMs && nowMs < MODEL.days[i].dayEndMs) return i;
  }
  return -1;
}

function titleList(items) {
  var names = items.map(function (x) { return x.title; });
  if (names.length === 1) return names[0];
  if (names.length === 2) return names[0] + " and " + names[1];
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}

function renderHero(day, nowMs) {
  var headline = document.getElementById("headline");
  var subline = document.getElementById("subline");
  var chips = document.getElementById("chips");
  var name = MODEL.name;
  var chipHTML = "";

  if (!day) {
    headline.textContent = name + "'s schedule is out of date";
    subline.innerHTML = "This page was last updated on <strong>" + esc(MODEL.generatedLabel) + "</strong>.";
    chips.innerHTML = "";
    return;
  }

  var st = statusFor(day.items, nowMs);

  if (st.state === "in") {
    headline.textContent = headlineFor(name, st.currents);
    var endLabel = "";
    for (var i = 0; i < st.currents.length; i++) {
      if (st.currents[i].e === st.untilMs) endLabel = st.currents[i].endLabel;
    }
    subline.innerHTML = esc(titleList(st.currents)) + " until " + esc(endLabel) +
      ", free in <strong>" + gapLabel(st.untilMs - nowMs) + "</strong>.";
    var places = [];
    for (var j = 0; j < st.currents.length; j++) {
      if (places.indexOf(st.currents[j].place) === -1) places.push(st.currents[j].place);
    }
    chipHTML += '<span class="chip live"><span class="dot"></span>' + esc(places.join(" + ")) +
      " until " + esc(endLabel) + "</span>";
    if (st.next) {
      chipHTML += '<span class="chip"><span class="dot"></span>Next ' + esc(st.next.startLabel) + "</span>";
    }
  } else if (st.state === "before") {
    headline.textContent = name + " starts at " + st.next.startLabel;
    subline.innerHTML = "First up is " + esc(st.next.title) + ", in <strong>" +
      gapLabel(st.next.s - nowMs) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Free right now</span>';
    if (day.classCount) {
      chipHTML += '<span class="chip"><span class="dot"></span>' + day.classCount +
        (day.classCount === 1 ? " class today" : " classes today") + "</span>";
    }
  } else if (st.state === "gap") {
    headline.textContent = name + " is free";
    subline.innerHTML = "Next is " + esc(st.next.title) + " at <strong>" +
      esc(st.next.startLabel) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Free for ' +
      gapLabel(st.next.s - nowMs) + "</span>";
  } else if (st.state === "done") {
    headline.textContent = name + " is done for the day";
    subline.innerHTML = "Last finished at <strong>" + esc(day.lastLabel) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Nothing left today</span>';
  } else {
    headline.textContent = name + " has nothing on today";
    subline.innerHTML = "Nothing on the calendar for <strong>" + esc(day.label) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Day off</span>';
  }

  if (MODEL.phone) {
    chipHTML += '<a class="chip" href="tel:' + esc(MODEL.phone) + '"><span class="dot"></span>Call ' +
      esc(name) + "</a>";
  }
  chips.innerHTML = chipHTML;
}

function renderDay(day, nowMs) {
  var host = document.getElementById("today");
  document.getElementById("todayHeading").textContent = day ? day.label : "Today";

  if (!day || day.groups.length === 0) {
    host.innerHTML = '<div class="empty">Nothing on the calendar for this day.</div>';
    return;
  }

  var html = "";
  for (var g = 0; g < day.groups.length; g++) {
    var grp = day.groups[g];

    if (g > 0) {
      var prev = day.groups[g - 1];
      var gapMs = grp.s - prev.e;
      if (gapMs >= MODEL.minGapMs) {
        var here = nowMs >= prev.e && nowMs < grp.s;
        html += '<div class="gap' + (here ? " here" : "") + '"><div></div><div class="line">' +
          '<span class="txt">' + (here ? "Free now, " + gapLabel(grp.s - nowMs) + " to go" :
            gapLabel(gapMs) + " free") + "</span></div></div>";
      }
    }

    html += '<div class="slot"><div class="when">' + esc(grp.startLabel) +
      '<span class="to">' + esc(grp.endLabel) + "</span></div><div>";

    if (grp.items.length > 1) {
      html += '<div class="together">' + grp.items.length + " at the same time</div>";
    }
    html += '<div class="stack">';
    for (var i = 0; i < grp.items.length; i++) {
      var it = grp.items[i];
      var live = nowMs >= it.s && nowMs < it.e;
      html += '<div class="ev' + (live ? " live" : "") + (it.type === "personal" ? " personal" : "") + '">' +
        (live ? '<span class="nowtag">now</span>' : "") +
        '<div class="k">' + esc(it.title) + "</div>" +
        '<div class="p">' + esc(it.place) + " &middot; " + esc(it.startLabel) + " to " + esc(it.endLabel) +
        "</div></div>";
    }
    html += "</div></div></div>";
  }
  host.innerHTML = html;
}

function renderWeek(startIndex) {
  var host = document.getElementById("week");
  var html = "";
  for (var i = startIndex + 1; i < MODEL.days.length; i++) {
    var d = MODEL.days[i];
    var n = d.classCount;
    html += '<div class="row' + (n ? "" : " off") + '">' +
      '<div class="d">' + esc(d.short) + "</div>" +
      '<div class="t">' + (d.count ? esc(d.firstLabel) + " to " + esc(d.lastLabel) : "Nothing scheduled") + "</div>" +
      '<div class="n">' + (n ? n + (n === 1 ? " class" : " classes") : "Off") + "</div>" +
      "</div>";
  }
  host.innerHTML = html || '<div class="empty">Nothing else on this week.</div>';
}

function renderFreshness(nowMs) {
  var ageH = (nowMs - MODEL.generatedAt) / 3600000;
  var el = document.getElementById("freshness");
  if (ageH > 30) {
    el.innerHTML = '<span class="stale">Last updated ' + esc(MODEL.generatedLabel) +
      ", so this may be out of date.</span>";
  } else {
    el.textContent = "Last updated " + MODEL.generatedLabel + ".";
  }
}

function draw() {
  var now = Date.now();
  var idx = todayIndex(now);
  var day = idx === -1 ? null : MODEL.days[idx];
  renderHero(day, now);
  renderDay(day, now);
  renderWeek(idx === -1 ? MODEL.days.length : idx);
  renderFreshness(now);
}

draw();
setInterval(draw, 30000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) draw();
});
</script>
