<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15100E">
<title>Where is Rohit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ebony: #15100E;
    --board: #1F1815;
    --edge: #33272192;
    --spruce: #F3ECE4;
    --muted: #A6968A;
    --brass: #C9A227;
    --sage: #7C9A7E;
    --strike: #E0533D;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ebony);
    color: var(--spruce);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 26px 20px 44px; }

  .eyebrow {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px;
  }
  .hero { margin: 0 0 6px; }
  .hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: clamp(30px, 9vw, 42px);
    line-height: 1.06; margin: 0 0 10px; letter-spacing: -0.01em;
  }
  .hero .sub { color: var(--muted); font-size: 15px; margin: 0; }
  .hero .sub strong { color: var(--spruce); font-weight: 500; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
  .chip {
    font-size: 13px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--edge); background: var(--board); color: var(--spruce);
    text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brass); }
  .chip.live .dot { background: var(--strike); }
  .chip.free .dot { background: var(--sage); }
  .chip.call { border-color: #4a3a2e; }

  h2.section {
    font-family: "Fraunces", Georgia, serif; font-weight: 400;
    font-size: 15px; letter-spacing: .02em; color: var(--muted);
    margin: 34px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--edge);
  }

  /* The day rail: a fretboard of the working day, proportional to real time. */
  .rail { position: relative; margin-top: 4px; }
  .rail .track {
    position: absolute; left: 54px; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(180deg, #2b211c, #3a2c24 50%, #2b211c);
    border-radius: 2px;
  }
  .rail .block {
    position: absolute; left: 54px; right: 0;
    padding-left: 16px; display: flex; align-items: center;
  }
  .rail .block .body {
    width: 100%; background: var(--board); border: 1px solid var(--edge);
    border-left: 3px solid var(--brass); border-radius: 10px;
    padding: 9px 12px; min-height: 46px;
  }
  .rail .block.now .body { border-left-color: var(--strike); background: #241a16; }
  .rail .block .k { font-size: 14px; font-weight: 500; }
  .rail .block .p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rail .stamp {
    position: absolute; left: 0; width: 48px; text-align: right;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .rail .nowline {
    position: absolute; left: 34px; right: 0; height: 1px; background: var(--strike);
  }
  .rail .nowline::before {
    content: ""; position: absolute; left: 18px; top: -3px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--strike);
  }
  .rail .nowline span {
    position: absolute; left: 0; top: -7px; font-size: 10px; color: var(--strike);
    letter-spacing: .08em; text-transform: uppercase; background: var(--ebony); padding-right: 4px;
  }

  .empty {
    border: 1px dashed var(--edge); border-radius: var(--radius);
    padding: 20px; color: var(--muted); font-size: 14px; text-align: center;
  }

  .week { display: grid; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 78px 1fr auto; align-items: center; gap: 10px;
    background: var(--board); border: 1px solid var(--edge);
    border-radius: 10px; padding: 11px 13px;
  }
  .row .d { font-size: 13px; font-weight: 500; }
  .row .t { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .n { font-size: 12px; color: var(--brass); }
  .row.off .n { color: var(--sage); }

  footer { margin-top: 30px; font-size: 12px; color: #6f6259; line-height: 1.6; }
  footer .stale { color: var(--strike); }

  @media (prefers-reduced-motion: no-preference) {
    .chip.live .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Rohit's day</p>
  <div class="hero">
    <h1 id="headline">Loading</h1>
    <p class="sub" id="subline"></p>
    <div class="chips" id="chips"></div>
  </div>

  <h2 class="section" id="todayHeading">Today</h2>
  <div id="today"></div>

  <h2 class="section">Rest of the week</h2>
  <div class="week" id="week"></div>

  <footer>
    <div id="freshness"></div>
    <div>This page updates itself each morning. Times are Rohit's local times.</div>
  </footer>
</div>

<script>
const MODEL = {"name":"Rohit","phone":"+919654338350","freeNote":"not teaching","generatedAt":1792144151497,"generatedLabel":"Friday, 16 Oct, 3:19pm","days":[{"index":0,"label":"Friday, 16 Oct","short":"Fri 16","dayStartMs":1792089000000,"dayEndMs":1792175400000,"events":[{"s":1792148400000,"e":1792151100000,"startLabel":"4:30pm","endLabel":"5:15pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792151100000,"e":1792153800000,"startLabel":"5:15pm","endLabel":"6pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792153800000,"e":1792156500000,"startLabel":"6pm","endLabel":"6:45pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792157400000,"e":1792158600000,"startLabel":"7pm","endLabel":"7:20pm","kind":"Demo class","title":"Demo class","place":"Online","note":"teaching on Zoom"}],"count":4,"firstLabel":"4:30pm","lastLabel":"7:20pm","railStartMs":1792145700000,"railEndMs":1792161300000},{"index":1,"label":"Saturday, 17 Oct","short":"Sat 17","dayStartMs":1792175400000,"dayEndMs":1792261800000,"events":[{"s":1792212300000,"e":1792215000000,"startLabel":"10:15am","endLabel":"11am","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792215000000,"e":1792218600000,"startLabel":"11am","endLabel":"12pm","kind":"Group class","title":"Group class","place":"Class","note":"teaching"},{"s":1792218600000,"e":1792224000000,"startLabel":"12pm","endLabel":"1:30pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792224000000,"e":1792226700000,"startLabel":"1:30pm","endLabel":"2:15pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792226700000,"e":1792229400000,"startLabel":"2:15pm","endLabel":"3pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792227600000,"e":1792230300000,"startLabel":"2:30pm","endLabel":"3:15pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792229400000,"e":1792232100000,"startLabel":"3pm","endLabel":"3:45pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792231200000,"e":1792233900000,"startLabel":"3:30pm","endLabel":"4:15pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792233900000,"e":1792236600000,"startLabel":"4:15pm","endLabel":"5pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792236600000,"e":1792239300000,"startLabel":"5pm","endLabel":"5:45pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792236600000,"e":1792240200000,"startLabel":"5pm","endLabel":"6pm","kind":"Group class","title":"Group class","place":"Class","note":"teaching"},{"s":1792239300000,"e":1792242000000,"startLabel":"5:45pm","endLabel":"6:30pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792244700000,"e":1792247400000,"startLabel":"7:15pm","endLabel":"8pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"}],"count":13,"firstLabel":"10:15am","lastLabel":"8pm","railStartMs":1792209600000,"railEndMs":1792250100000},{"index":2,"label":"Sunday, 18 Oct","short":"Sun 18","dayStartMs":1792261800000,"dayEndMs":1792348200000,"events":[{"s":1792297800000,"e":1792300500000,"startLabel":"10am","endLabel":"10:45am","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792300500000,"e":1792303200000,"startLabel":"10:45am","endLabel":"11:30am","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792303200000,"e":1792305900000,"startLabel":"11:30am","endLabel":"12:15pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792305900000,"e":1792308600000,"startLabel":"12:15pm","endLabel":"1pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792308600000,"e":1792311300000,"startLabel":"1pm","endLabel":"1:45pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792308600000,"e":1792311300000,"startLabel":"1pm","endLabel":"1:45pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792308600000,"e":1792312200000,"startLabel":"1pm","endLabel":"2pm","kind":"Group class","title":"Group class","place":"Class","note":"teaching"},{"s":1792312200000,"e":1792314900000,"startLabel":"2pm","endLabel":"2:45pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792315800000,"e":1792318500000,"startLabel":"3pm","endLabel":"3:45pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792317600000,"e":1792320300000,"startLabel":"3:30pm","endLabel":"4:15pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792319400000,"e":1792323000000,"startLabel":"4pm","endLabel":"5pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792320300000,"e":1792323000000,"startLabel":"4:15pm","endLabel":"5pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792323000000,"e":1792325700000,"startLabel":"5pm","endLabel":"5:45pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792323000000,"e":1792325700000,"startLabel":"5pm","endLabel":"5:45pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792325700000,"e":1792328400000,"startLabel":"5:45pm","endLabel":"6:30pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792328400000,"e":1792331100000,"startLabel":"6:30pm","endLabel":"7:15pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"}],"count":16,"firstLabel":"10am","lastLabel":"7:15pm","railStartMs":1792295100000,"railEndMs":1792333800000},{"index":3,"label":"Monday, 19 Oct","short":"Mon 19","dayStartMs":1792348200000,"dayEndMs":1792434600000,"events":[{"s":1792381500000,"e":1792384200000,"startLabel":"9:15am","endLabel":"10am","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792407600000,"e":1792410300000,"startLabel":"4:30pm","endLabel":"5:15pm","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"}],"count":2,"firstLabel":"9:15am","lastLabel":"5:15pm","railStartMs":1792378800000,"railEndMs":1792413000000},{"index":4,"label":"Tuesday, 20 Oct","short":"Tue 20","dayStartMs":1792434600000,"dayEndMs":1792521000000,"events":[{"s":1792467900000,"e":1792470600000,"startLabel":"9:15am","endLabel":"10am","kind":"Zoom class","title":"Zoom class","place":"Online","note":"teaching on Zoom"},{"s":1792492200000,"e":1792494900000,"startLabel":"4pm","endLabel":"4:45pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792494900000,"e":1792497600000,"startLabel":"4:45pm","endLabel":"5:30pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792497600000,"e":1792500300000,"startLabel":"5:30pm","endLabel":"6:15pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792500300000,"e":1792503000000,"startLabel":"6:15pm","endLabel":"7pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792503000000,"e":1792505700000,"startLabel":"7pm","endLabel":"7:45pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"},{"s":1792505700000,"e":1792508400000,"startLabel":"7:45pm","endLabel":"8:30pm","kind":"Individual class","title":"Individual class","place":"Class","note":"teaching"}],"count":7,"firstLabel":"9:15am","lastLabel":"8:30pm","railStartMs":1792465200000,"railEndMs":1792511100000},{"index":5,"label":"Wednesday, 21 Oct","short":"Wed 21","dayStartMs":1792521000000,"dayEndMs":1792607400000,"events":[],"count":0,"firstLabel":"","lastLabel":"","railStartMs":null,"railEndMs":null},{"index":6,"label":"Thursday, 22 Oct","short":"Thu 22","dayStartMs":1792607400000,"dayEndMs":1792693800000,"events":[],"count":0,"firstLabel":"","lastLabel":"","railStartMs":null,"railEndMs":null}]};
const statusFor = function statusFor(events, nowMs) {
  if (!events || events.length === 0) {
    return { state: "off", current: null, next: null, untilMs: null };
  }
  let current = null;
  let next = null;
  for (let i = 0; i < events.length; i++) {
    const ev = events[i];
    if (nowMs >= ev.s && nowMs < ev.e) {
      current = ev;
      next = events[i + 1] || null;
      break;
    }
    if (nowMs < ev.s) {
      next = ev;
      break;
    }
  }
  if (current) {
    return { state: "in", current: current, next: next, untilMs: current.e };
  }
  if (next) {
    const first = events[0];
    const state = nowMs < first.s ? "before" : "gap";
    return { state: state, current: null, next: next, untilMs: next.s };
  }
  return { state: "done", current: null, next: null, untilMs: null };
};
const gapLabel = function gapLabel(ms) {
  if (ms <= 0) return "now";
  if (ms < 60000) return "under a minute";
  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + (mins === 1 ? " minute" : " minutes");
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (m === 0) return h + (h === 1 ? " hour" : " hours");
  return h + "h " + m + "m";
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function todayIndex(nowMs) {
  for (var i = 0; i < MODEL.days.length; i++) {
    if (nowMs >= MODEL.days[i].dayStartMs && nowMs < MODEL.days[i].dayEndMs) return i;
  }
  return -1;
}

function renderHero(day, nowMs) {
  var headline = document.getElementById("headline");
  var subline = document.getElementById("subline");
  var chips = document.getElementById("chips");
  var name = MODEL.name;

  if (!day) {
    headline.textContent = name + "'s schedule is out of date";
    subline.innerHTML = "This page was last updated on <strong>" + esc(MODEL.generatedLabel) + "</strong>.";
    chips.innerHTML = "";
    return;
  }

  var st = statusFor(day.events, nowMs);
  var chipHTML = "";

  if (st.state === "in") {
    headline.textContent = name + " is in a class";
    subline.innerHTML = esc(st.current.title) + " " + esc(st.current.note) +
      ", free in <strong>" + gapLabel(st.current.e - nowMs) + "</strong>.";
    chipHTML += '<span class="chip live"><span class="dot"></span>' + esc(st.current.place) +
      " until " + esc(st.current.endLabel) + "</span>";
    if (st.next) {
      chipHTML += '<span class="chip"><span class="dot"></span>Next ' + esc(st.next.startLabel) + "</span>";
    }
  } else if (st.state === "before") {
    headline.textContent = name + " starts at " + st.next.startLabel;
    subline.innerHTML = "First class in <strong>" + gapLabel(st.next.s - nowMs) + "</strong>, " +
      esc(st.next.note) + ".";
    chipHTML += '<span class="chip free"><span class="dot"></span>Free right now</span>';
    chipHTML += '<span class="chip"><span class="dot"></span>' + day.count + " classes today</span>";
  } else if (st.state === "gap") {
    headline.textContent = name + " is free";
    subline.innerHTML = "Next class at <strong>" + esc(st.next.startLabel) + "</strong>, " +
      esc(st.next.note) + ".";
    chipHTML += '<span class="chip free"><span class="dot"></span>Free for ' +
      gapLabel(st.next.s - nowMs) + "</span>";
  } else if (st.state === "done") {
    headline.textContent = name + " is done for the day";
    subline.innerHTML = "Last class ended at <strong>" +
      esc(day.events[day.events.length - 1].endLabel) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>No classes left</span>';
  } else {
    headline.textContent = name + " has no classes today";
    subline.innerHTML = "Nothing on the teaching calendar for <strong>" + esc(day.label) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Day off</span>';
  }

  if (MODEL.phone) {
    chipHTML += '<a class="chip call" href="tel:' + esc(MODEL.phone) + '"><span class="dot"></span>Call ' + esc(name) + "</a>";
  }
  chips.innerHTML = chipHTML;
}

function renderRail(day, nowMs) {
  var host = document.getElementById("today");
  document.getElementById("todayHeading").textContent = day ? day.label : "Today";

  if (!day || day.events.length === 0) {
    host.innerHTML = '<div class="empty">No classes on the calendar for this day.</div>';
    return;
  }

  var span = day.railEndMs - day.railStartMs;
  var minutes = span / 60000;
  var height = Math.max(260, Math.min(720, Math.round(minutes * 1.5)));
  var html = '<div class="rail" style="height:' + height + 'px"><div class="track"></div>';

  for (var i = 0; i < day.events.length; i++) {
    var ev = day.events[i];
    var top = ((ev.s - day.railStartMs) / span) * height;
    var h = Math.max(46, ((ev.e - ev.s) / span) * height - 6);
    var live = nowMs >= ev.s && nowMs < ev.e;
    html += '<div class="stamp" style="top:' + (top + 2) + 'px">' + esc(ev.startLabel) + "</div>";
    html += '<div class="block' + (live ? " now" : "") + '" style="top:' + top + "px;height:" + h + 'px">' +
      '<div class="body"><div class="k">' + esc(ev.title) + "</div>" +
      '<div class="p">' + esc(ev.place) + " &middot; " + esc(ev.startLabel) + " to " + esc(ev.endLabel) +
      "</div></div></div>";
  }

  if (nowMs > day.railStartMs && nowMs < day.railEndMs) {
    var ntop = ((nowMs - day.railStartMs) / span) * height;
    html += '<div class="nowline" style="top:' + ntop + 'px"><span>now</span></div>';
  }

  html += "</div>";
  host.innerHTML = html;
}

function renderWeek(startIndex) {
  var host = document.getElementById("week");
  var html = "";
  for (var i = startIndex + 1; i < MODEL.days.length; i++) {
    var d = MODEL.days[i];
    html += '<div class="row' + (d.count ? "" : " off") + '">' +
      '<div class="d">' + esc(d.short) + "</div>" +
      '<div class="t">' + (d.count ? esc(d.firstLabel) + " to " + esc(d.lastLabel) : "Nothing scheduled") + "</div>" +
      '<div class="n">' + (d.count ? d.count + (d.count === 1 ? " class" : " classes") : "Off") + "</div>" +
      "</div>";
  }
  host.innerHTML = html || '<div class="empty">Nothing else on this week.</div>';
}

function renderFreshness(nowMs) {
  var ageH = (nowMs - MODEL.generatedAt) / 3600000;
  var el = document.getElementById("freshness");
  if (ageH > 30) {
    el.innerHTML = '<span class="stale">Last updated ' + esc(MODEL.generatedLabel) +
      ", so this may be out of date.</span>";
  } else {
    el.textContent = "Last updated " + MODEL.generatedLabel + ".";
  }
}

function draw() {
  var now = Date.now();
  var idx = todayIndex(now);
  var day = idx === -1 ? null : MODEL.days[idx];
  renderHero(day, now);
  renderRail(day, now);
  renderWeek(idx === -1 ? MODEL.days.length : idx);
  renderFreshness(now);
}

draw();
setInterval(draw, 30000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) draw();
});
</script>
</body>
</html>
