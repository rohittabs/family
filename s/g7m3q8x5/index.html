<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF7F2">
<title>Where is Rohit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F2;
    --card: #FFFFFF;
    --edge: #E6DED2;
    --ink: #1C1917;
    --muted: #7A6E63;
    --brass: #9A6B12;
    --sage: #4F7A54;
    --strike: #C2410C;
    --shadow: 0 1px 2px rgba(28, 25, 23, .05);
    --chip-now: #B91C1C;
    --chip-busy: #2563EB;
    --chip-next: #D97706;
    --chip-free: #15803D;
    --chip-call: #7C3AED;
    --radius: 14px;
  }
  
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 26px 20px 48px; }

  .eyebrow {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px;
  }
  .hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: clamp(30px, 8.5vw, 42px);
    line-height: 1.06; margin: 0 0 10px; letter-spacing: -0.01em;
  }
  .hero .sub { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.5; }
  .hero .sub strong { color: var(--ink); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
  .chip {
    font-size: 13px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--edge); background: var(--card); color: var(--ink);
    text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
    box-shadow: var(--shadow);
  }
  /* Each chip kind has one fixed colour that means the same thing every time. */
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip.now .dot { background: var(--chip-now); }
  .chip.busy .dot { background: var(--chip-busy); }
  .chip.next .dot { background: var(--chip-next); }
  .chip.free .dot { background: var(--chip-free); }
  .chip.call .dot { background: var(--chip-call); }
  .chip.call { font-weight: 500; }

  h2.section {
    font-family: "Fraunces", Georgia, serif; font-weight: 400;
    font-size: 15px; color: var(--muted);
    margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--edge);
  }

  /* The day: a simple vertical flow. Never overlaps, however dense the day. */
  .slot { display: grid; grid-template-columns: 62px 1fr; gap: 12px; }
  .slot .when {
    font-size: 12px; color: var(--muted); text-align: right;
    font-variant-numeric: tabular-nums; padding-top: 12px; line-height: 1.45;
  }
  .slot .when .to { display: block; opacity: .65; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  /* --c is the event's calendar colour, set inline per card. */
  .ev {
    --c: var(--brass);
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--edge);
    border-left: 4px solid var(--c); border-radius: 10px;
    padding: 10px 13px; box-shadow: var(--shadow);
  }
  .ev::before {
    content: ""; position: absolute; inset: 0;
    background: var(--c); opacity: .08; pointer-events: none;
  }
  .ev > * { position: relative; }
  .ev.personal { --c: var(--sage); }
  /* "Now" must read on any calendar colour, including red, orange and black,
     so it is marked by the card's own colour plus a dark label, not one hue. */
  .ev.live { box-shadow: 0 0 0 2px var(--c), 0 4px 14px rgba(28, 25, 23, .10); }
  .ev.live::before { opacity: .16; }
  .ev .cal {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--c); margin-right: 6px; vertical-align: 1px;
  }
  .ev .k { font-size: 15px; font-weight: 500; }
  .ev .p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .ev .nowtag {
    float: right; font-size: 10px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--paper); background: var(--ink);
    padding: 3px 7px; border-radius: 999px; margin-top: 1px;
  }
  .together {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 2px 0 2px 2px;
  }

  .gap {
    display: grid; grid-template-columns: 62px 1fr; gap: 12px;
    align-items: center; margin: 6px 0;
  }
  .gap .line {
    border-top: 1px dashed var(--edge); position: relative; height: 1px;
  }
  .gap .txt {
    position: absolute; top: -9px; left: 0; background: var(--paper);
    padding-right: 10px; font-size: 11.5px; color: var(--muted);
  }
  .gap.here .line { border-top-color: var(--strike); }
  .gap.here .txt { color: var(--strike); }

  .empty {
    border: 1px dashed var(--edge); border-radius: var(--radius);
    padding: 22px; color: var(--muted); font-size: 14px; text-align: center;
  }

  /* Coming up: one card per day, tap to see the full day. */
  .week { display: grid; gap: 10px; }
  .day {
    background: var(--card); border: 1px solid var(--edge);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .day > summary, .day > .head {
    display: grid; grid-template-columns: 50px 1fr 14px; gap: 12px;
    align-items: start; padding: 13px 14px; list-style: none;
  }
  .day > summary { cursor: pointer; }
  .day > summary::-webkit-details-marker { display: none; }
  .day > summary:focus-visible { outline: 2px solid var(--chip-busy); outline-offset: 2px; border-radius: 12px; }
  .dd { display: flex; flex-direction: column; line-height: 1.2; }
  .dn { font-size: 15px; font-weight: 600; }
  .dm { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .dt { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dt::before {
    content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%;
    background: var(--brass);
  }
  .day.online .dt::before { background: var(--chip-busy); }
  .day.off .dt::before, .day.none .dt::before { background: var(--chip-free); }
  .day.none .dt { font-weight: 500; color: var(--muted); }
  .dl { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.45; padding-left: 16px; }
  .chev {
    width: 8px; height: 8px; margin-top: 6px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg);
  }
  .day[open] .chev { transform: rotate(-135deg); margin-top: 10px; }
  .dlist { border-top: 1px solid var(--edge); padding: 8px 14px 12px; }
  .li {
    display: grid; grid-template-columns: 62px 1fr; gap: 10px;
    padding: 5px 0; font-size: 13.5px; align-items: baseline;
  }
  .li .lt { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .li .ln { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .li .ldot {
    --c: var(--brass); flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--c); align-self: center;
  }
  .li.personal .ldot { --c: var(--sage); }
  .li .le { color: var(--muted); font-size: 12.5px; }
  @media (prefers-reduced-motion: no-preference) {
    .chev { transition: transform .2s ease, margin-top .2s ease; }
  }

  footer { margin-top: 30px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  footer .stale { color: var(--strike); }

  @media (prefers-reduced-motion: no-preference) {
    .chip.now .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  }
</style>
</head>

</div>

  if (classes.length === currents.length) {
    return name + " is in " + currents.length + " classes at once";
  }
  return name + " is " + currents[0].headline;
};
const busyUntil = function busyUntil(items, nowMs, joinMs) {
  if (!items || items.length === 0) return nowMs;
  var sorted = items.slice().sort(function (a, b) { return a.s - b.s; });
  var end = nowMs;
  for (var i = 0; i < sorted.length; i++) {
    var it = sorted[i];
    if (it.e <= nowMs) continue;
    if (it.s < end + joinMs || (it.s <= nowMs && it.e > nowMs)) {
      if (it.e > end) end = it.e;
    } else {
      break;
    }
  }
  return end;
};
const stretchRuns = function stretchRuns(items, nowMs, untilMs) {
  var inStretch = (items || []).filter(function (x) { return x.e > nowMs && x.s < untilMs; })
    .sort(function (a, b) { return a.s - b.s || a.e - b.e; });
  var runs = [];
  for (var i = 0; i < inStretch.length; i++) {
    var it = inStretch[i];
    var last = runs[runs.length - 1];
    if (last && last.type === "class" && it.type === "class") {
      last.items.push(it);
      if (it.e > last.e) last.e = it.e;
    } else if (last && it.s < last.e && it.type !== last.type) {
      // Overlaps a different kind of run already under way: it belongs to
      // what is happening, not to what comes next.
      last.items.push(it);
      if (it.e > last.e) last.e = it.e;
    } else {
      runs.push({ type: it.type, s: it.s, e: it.e, headline: it.headline, items: [it] });
    }
  }
  return runs;
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

// Colours were normalised to #RRGGBB before publishing; checked again here so
// a hand-edited page can never smuggle anything into a style attribute.
function safeColor(c) {
  return typeof c === "string" && /^#[0-9A-Fa-f]{6}$/.test(c) ? c : null;
}

function colorStyle(it) {
  var c = safeColor(it.color);
  return c ? ' style="--c:' + c + '"' : "";
}

function todayIndex(nowMs) {
  for (var i = 0; i < MODEL.days.length; i++) {
    if (nowMs >= MODEL.days[i].dayStartMs && nowMs < MODEL.days[i].dayEndMs) return i;
  }
  return -1;
}

function plural(title, n) {
  if (n === 1) return title;
  return n + " " + title + (/s$/.test(title) ? "es" : "s");
}

// "Individual class and Individual class" becomes "2 Individual classes".
function titleList(items) {
  var order = [];
  var counts = {};
  for (var i = 0; i < items.length; i++) {
    var t = items[i].title;
    if (!counts[t]) { counts[t] = 0; order.push(t); }
    counts[t]++;
  }
  var names = order.map(function (t) { return plural(t, counts[t]); });
  if (names.length === 1) return names[0];
  if (names.length === 2) return names[0] + " and " + names[1];
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}

// Label for a time an item ends, used to name the end of a busy stretch.
function endLabelAt(day, ms) {
  for (var i = 0; i < day.items.length; i++) {
    if (day.items[i].e === ms) return day.items[i].endLabel;
  }
  return "";
}

function renderHero(day, nowMs) {
  var headline = document.getElementById("headline");
  var subline = document.getElementById("subline");
  var chips = document.getElementById("chips");
  var name = MODEL.name;
  var chipHTML = "";

  if (!day) {
    headline.textContent = name + "'s schedule is out of date";
    subline.innerHTML = "This page was last updated on <strong>" + esc(MODEL.generatedLabel) + "</strong>.";
    chips.innerHTML = "";
    return;
  }

  var st = statusFor(day.items, nowMs);
  // The first real break: overlapping, back to back and short gaps chain on.
  var freeAt = busyUntil(day.items, nowMs, MODEL.minGapMs);
  var freeLabel = freeAt > nowMs ? endLabelAt(day, freeAt) : "";
  var lastOfDay = freeAt >= Math.max.apply(null, day.items.map(function (x) { return x.e; }));

  if (st.state === "in") {
    headline.textContent = headlineFor(name, st.currents);

    // Classes and personal time are described separately, so the drive home
    // after the last class is never counted as class time.
    var runs = stretchRuns(day.items, nowMs, freeAt);
    var cur = runs[0];
    var curEnd = endLabelAt(day, cur.e);
    var maxNow = st.untilMs;
    var text;
    if (cur.type === "class") {
      text = "Now: " + esc(titleList(st.currents)) + ". " +
        (cur.e > maxNow ? "Back to back classes until " : "Until ") +
        "<strong>" + esc(curEnd) + "</strong>";
    } else {
      text = esc(titleList(st.currents)) + " until <strong>" + esc(curEnd) + "</strong>";
    }
    for (var r = 1; r < runs.length && r < 4; r++) {
      var run = runs[r];
      text += ", then " + (run.type === "class" ? "classes" : esc(run.headline)) +
        " until <strong>" + esc(endLabelAt(day, run.e)) + "</strong>";
    }
    if (runs.length > 1) {
      text += lastOfDay ? ". Done for the day after that." :
        ". Free in <strong>" + gapLabel(freeAt - nowMs) + "</strong>.";
    } else {
      text += lastOfDay ? ", then done for the day." :
        ", free in <strong>" + gapLabel(freeAt - nowMs) + "</strong>.";
    }
    subline.innerHTML = text;

    var places = [];
    for (var j = 0; j < st.currents.length; j++) {
      if (places.indexOf(st.currents[j].place) === -1) places.push(st.currents[j].place);
    }
    chipHTML += '<span class="chip now"><span class="dot"></span>' +
      esc(places.join(" + ")) + " now</span>";
    chipHTML += '<span class="chip busy"><span class="dot"></span>' +
      (cur.type === "class" ? "Classes until " + esc(curEnd) : "Busy until " + esc(freeLabel)) + "</span>";
  } else if (st.state === "gap" && freeAt > nowMs) {
    // A break shorter than MIN_GAP_MIN: not free, just changing over.
    headline.textContent = name + " is between classes";
    subline.innerHTML = "Next is " + esc(st.next.title) + " at <strong>" + esc(st.next.startLabel) +
      "</strong>, busy until <strong>" + esc(freeLabel) + "</strong>.";
    chipHTML += '<span class="chip next"><span class="dot"></span>Next in ' +
      gapLabel(st.next.s - nowMs) + "</span>";
  } else if (st.state === "before") {
    headline.textContent = name + " starts at " + st.next.startLabel;
    subline.innerHTML = "First up is " + esc(st.next.title) + ", in <strong>" +
      gapLabel(st.next.s - nowMs) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Free right now</span>';
    if (day.classCount) {
      chipHTML += '<span class="chip next"><span class="dot"></span>' + day.classCount +
        (day.classCount === 1 ? " class today" : " classes today") + "</span>";
    }
  } else if (st.state === "gap") {
    headline.textContent = name + " is free";
    subline.innerHTML = "Next is " + esc(st.next.title) + " at <strong>" +
      esc(st.next.startLabel) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Free for ' +
      gapLabel(st.next.s - nowMs) + "</span>";
  } else if (st.state === "done") {
    headline.textContent = name + " is done for the day";
    subline.innerHTML = "Last finished at <strong>" + esc(day.lastLabel) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Nothing left today</span>';
  } else {
    headline.textContent = name + " has nothing on today";
    subline.innerHTML = "Nothing on the calendar for <strong>" + esc(day.label) + "</strong>.";
    chipHTML += '<span class="chip free"><span class="dot"></span>Day off</span>';
  }

  if (MODEL.phone) {
    chipHTML += '<a class="chip call" href="tel:' + esc(MODEL.phone) + '"><span class="dot"></span>Call ' +
      esc(name) + "</a>";
  }
  chips.innerHTML = chipHTML;
}

function renderDay(day, nowMs) {
  var host = document.getElementById("today");
  document.getElementById("todayHeading").textContent = day ? day.label : "Today";

  if (!day || day.groups.length === 0) {
    host.innerHTML = '<div class="empty">Nothing on the calendar for this day.</div>';
    return;
  }

  var html = "";
  for (var g = 0; g < day.groups.length; g++) {
    var grp = day.groups[g];

    if (g > 0) {
      var prev = day.groups[g - 1];
      var gapMs = grp.s - prev.e;
      if (gapMs >= MODEL.minGapMs) {
        var here = nowMs >= prev.e && nowMs < grp.s;
        html += '<div class="gap' + (here ? " here" : "") + '"><div></div><div class="line">' +
          '<span class="txt">' + (here ? "Free now, " + gapLabel(grp.s - nowMs) + " to go" :
            gapLabel(gapMs) + " free") + "</span></div></div>";
      }
    }

    html += '<div class="slot"><div class="when">' + esc(grp.startLabel) +
      '<span class="to">' + esc(grp.endLabel) + "</span></div><div>";

    if (grp.items.length > 1) {
      // Honest about chains: 4 overlapping classes that never run more than
      // 2 at a time are "back to back", not "4 at the same time".
      html += '<div class="together">' +
        (grp.peak >= grp.items.length ? grp.items.length + " at the same time" :
          grp.items.length + " back to back, up to " + grp.peak + " at once") + "</div>";
    }
    html += '<div class="stack">';
    for (var i = 0; i < grp.items.length; i++) {
      var it = grp.items[i];
      var live = nowMs >= it.s && nowMs < it.e;
      html += '<div class="ev' + (live ? " live" : "") + (it.type === "personal" ? " personal" : "") + '"' +
        colorStyle(it) + ">" +
        (live ? '<span class="nowtag">now</span>' : "") +
        '<div class="k"><span class="cal"></span>' + esc(it.title) + "</div>" +
        '<div class="p">' + (MODEL.showCardPlace ? esc(it.place) + " &middot; " : "") +
        esc(it.startLabel) + " to " + esc(it.endLabel) +
        "</div></div>";
    }
    html += "</div></div></div>";
  }
  host.innerHTML = html;
}

// The day's plan in words, shown on every upcoming-day card.
function dayHead(d, expandable) {
  var s = d.summary;
  var lines = "";
  for (var i = 0; i < s.lines.length; i++) lines += '<div class="dl">' + esc(s.lines[i]) + "</div>";
  return '<div class="dd"><span class="dn">' + esc(d.weekday) + '</span><span class="dm">' +
    esc(d.dateShort) + "</span></div>" +
    '<div class="ds"><div class="dt">' + esc(s.title) + "</div>" + lines + "</div>" +
    (expandable ? '<span class="chev" aria-hidden="true"></span>' : "<span></span>");
}

// Everything on that day, in order, revealed when the card is tapped.
function dayList(d) {
  var html = '<div class="dlist">';
  for (var i = 0; i < d.items.length; i++) {
    var it = d.items[i];
    html += '<div class="li' + (it.type === "personal" ? " personal" : "") + '">' +
      '<span class="lt">' + esc(it.startLabel) + "</span>" +
      '<span class="ln"><span class="ldot"' + colorStyle(it) + "></span>" + esc(it.title) +
      ' <span class="le">to ' + esc(it.endLabel) + "</span></span></div>";
  }
  return html + "</div>";
}

// Upcoming days only change when the date does. Redrawing them every 30
// seconds would snap shut a day someone had just tapped open.
var weekDrawnFor = null;

function renderWeek(startIndex) {
  if (weekDrawnFor === startIndex) return;
  weekDrawnFor = startIndex;
  var host = document.getElementById("week");
  var html = "";
  for (var i = startIndex + 1; i < MODEL.days.length; i++) {
    var d = MODEL.days[i];
    var cls = "day " + d.summary.kind;
    if (d.items.length) {
      html += '<details class="' + cls + '"><summary>' + dayHead(d, true) + "</summary>" +
        dayList(d) + "</details>";
    } else {
      html += '<div class="' + cls + '"><div class="head">' + dayHead(d, false) + "</div></div>";
    }
  }
  host.innerHTML = html || '<div class="empty">Nothing else on this week.</div>';
}

function renderFreshness(nowMs) {
  var ageH = (nowMs - MODEL.generatedAt) / 3600000;
  var el = document.getElementById("freshness");
  if (ageH > 30) {
    el.innerHTML = '<span class="stale">Last updated ' + esc(MODEL.generatedLabel) +
      ", so this may be out of date.</span>";
  } else {
    el.textContent = "Last updated " + MODEL.generatedLabel + ".";
  }
}

function draw() {
  var now = Date.now();
  var idx = todayIndex(now);
  var day = idx === -1 ? null : MODEL.days[idx];
  renderHero(day, now);
  renderDay(day, now);
  renderWeek(idx === -1 ? MODEL.days.length : idx);
  renderFreshness(now);
}

draw();
setInterval(draw, 30000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) draw();
});
</script>
</body>
</html>
